<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio de Soluciones · Dinámicas de Equipo</title>
    <meta
      name="description"
      content="10 dinámicas de equipo para fomentar la cultura, la transparencia y la cohesión en tu organización."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#inicio">
          <span class="brand-mark">LS</span>
          <span class="brand-text">Laboratorio de Soluciones</span>
        </a>

      </header>

      <main id="inicio">

        <section class="section" id="ruletas">
          <div class="section-heading">
            <p class="eyebrow">Sorteo</p>
          </div>

          <div class="roulette-grid">
            <article class="roulette-card">
              <p class="roulette-label">Ruleta de dinámicas</p>
              <p class="roulette-value" id="dynamic-value">Cargando...</p>
              <button class="button button-primary" id="spin-dynamics" type="button" disabled>
                Girar dinámica
              </button>
            </article>

            <article class="roulette-card">
              <div class="roulette-header">
                <p class="roulette-label">Ruleta de usuarios</p>
                <p class="roulette-available" id="available-count">(cargando)</p>
              </div>
              <p class="roulette-value" id="user-value">Cargando...</p>
              <div class="roulette-controls">
                <button class="button button-primary" id="spin-users" type="button" disabled>
                  Girar usuario
                </button>
                <button class="button button-secondary" id="reset-users" type="button" title="Limpiar selecciones">
                  Resetear
                </button>
              </div>
            </article>
          </div>
        </section>

        <!-- Grid de las 10 dinámicas -->
        <section class="section reveal" id="dinamicas">
          <div class="section-heading">
            <p class="eyebrow">Dinámicas</p>
          </div>

          <div class="cards-grid" id="cards-grid">
            <p class="loading-msg">Cargando dinámicas…</p>
          </div>
        </section>

      </main>

      <footer class="site-footer">
        <p>Laboratorio de Soluciones</p>
        <p><span id="current-year"></span> · Publicado desde GitHub Pages</p>
      </footer>
    </div>

    <script src="script.js" type="module"></script>
  </body>
</html>
